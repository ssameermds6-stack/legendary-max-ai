name: Build Legendary Max AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "LegendaryMaxAI_Android_Project.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q LegendaryMaxAI_Android_Project.zip -d extracted

      - name: Fix MainActivity.java
        run: |
          FILE="extracted/LegendaryMaxAI/app/src/main/java/com/legendarymax/ai/MainActivity.java"

          if [ -f "$FILE" ]; then
            if ! grep -q "import android.graphics.Color;" "$FILE"; then
              sed -i '/^import /i import android.graphics.Color;' "$FILE"
            fi
            echo "MainActivity.java fixed:"
            sed -n '1,40p' "$FILE"
          else
            echo "MainActivity.java not found"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: |
          gradle -p extracted/LegendaryMaxAI :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Legendary-Max-AI-APK
          path: extracted/LegendaryMaxAI/app/build/outputs/apk/debug/app-debug.apk
